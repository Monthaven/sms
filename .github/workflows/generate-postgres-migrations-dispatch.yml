name: Generate Postgres Migrations (Dispatch)

on:
  workflow_dispatch: {}

jobs:
  generate-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monthaven
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monthaven"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps and run migrations (verbose)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monthaven?schema=public
        run: |
          set -eux
          npm ci
          npx prisma --version
          npx prisma generate --schema=prisma/schema_postgres.prisma
          npx prisma migrate dev --schema=prisma/schema_postgres.prisma --name init_postgres --create-only || true
          ls -la prisma/migrations || true

      - name: Upload migrations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-postgres-migrations
          path: backend/prisma/migrations
