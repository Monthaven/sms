name: CI

on:
  push:
    branches: [ main, fix/multer-upgrade ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/dev.db
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
        working-directory: backend

      - name: Ensure SQLite DB file exists
        run: node -e "require('fs').openSync('backend/prisma/dev.db','a')"

      - name: Run tests
        run: npm test
        working-directory: backend
