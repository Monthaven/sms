name: Generate Postgres Migrations

on:
  workflow_dispatch: {}

jobs:
  generate-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monthaven
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monthaven" \
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          set -eux
          cd backend
          npm ci

      - name: Wait for Postgres
        run: |
          set -eux
          echo "Waiting for Postgres to be ready..."
          for i in {1..20}; do pg_isready -h localhost -p 5432 -U postgres -d monthaven && break || sleep 2; done

      - name: Generate Postgres migrations (create-only)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monthaven?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/monthaven
        run: |
          set -eux
          echo "prisma version:"
          npx prisma --version
          echo "generate client"
          npx prisma generate --schema=prisma/schema_postgres.prisma
          echo "creating migrations (create-only)"
          npx prisma migrate dev --schema=prisma/schema_postgres.prisma --name init_postgres --create-only
          echo "listing prisma/migrations"
          ls -la prisma/migrations || true
          echo "show migration files"
          for f in prisma/migrations/*/migration.sql; do echo '---' $f; sed -n '1,120p' "$f" || true; done || true

      - name: Debug: list containers and logs
        if: always()
        run: |
          set -eux
          echo "docker ps -a"
          docker ps -a || true
          # try to find postgres container (services may have dynamic name)
          CID=$(docker ps -a --filter ancestor=postgres:15 --format "{{.ID}}" | head -n1 || true)
          echo "postgres container id: $CID"
          if [ -n "$CID" ]; then
            echo "=== docker logs begin ==="
            docker logs "$CID" || true
            echo "=== docker logs end ==="
          fi

      - name: Upload generated migrations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-postgres-migrations
          path: backend/prisma/migrations
