version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monthaven
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/monthaven?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@db:5432/monthaven"
      IMPORT_API_KEY: ${IMPORT_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      - db

volumes:
  pgdata:
